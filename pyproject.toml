[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Quantitative research toolkit: market-data clients, return/risk analytics and a vectorized backtester"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "jupytext"]

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.setuptools.package-data]
"quantlab.predict" = ["events.json"]
